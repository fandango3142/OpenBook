<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="referrer" content="no-referrer"><title>Manage booking</title></head>
<body>
  <p>Opening booking management…</p>
  <script>
    (function () {
      var token = new URLSearchParams(window.location.search).get('token');
      var destination = 'manage.html' + (token ? '?token=' + encodeURIComponent(token) : '');
      window.location.replace(destination);
    })();
  </script>
</body>
</html>
