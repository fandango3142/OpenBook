name: Validate and publish OpenBook product site

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --prefix tests/frontend
      - run: npm test
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: test
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble Pages output
        run: |
          mkdir -p dist
          cp index.html cancel.html manage.html reschedule.html dist/
          cp -R css js lib config site dist/
          cp config/settings.preview.yaml dist/config/settings.yaml
          touch dist/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
