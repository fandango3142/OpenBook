<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Book a time · OpenBook</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="lib/js-yaml.min.js"></script>
</head>
<body>
  <main class="container">
    <header class="header">
      <p class="eyebrow">OpenBook</p>
      <h1>Book a time</h1>
      <p>Choose a service and a time that works for you.</p>
    </header>
    <nav class="step-indicator" aria-label="Booking progress">
      <span class="step active" data-step="1">1 · Service</span>
      <span class="step" data-step="2">2 · Time</span>
      <span class="step" data-step="3">3 · Your details</span>
      <span class="step" data-step="4">4 · Confirm</span>
      <span class="step" data-step="5">5 · Done</span>
    </nav>

    <section id="step-1" class="step-content active" aria-labelledby="services-heading">
      <h2 id="services-heading">Choose a service</h2>
      <div id="services" class="service-list" aria-live="polite"></div>
    </section>
    <section id="step-2" class="step-content" aria-labelledby="time-heading">
      <h2 id="time-heading">Choose a time</h2>
      <p id="selected-service-info" class="selected-info"></p>
      <button type="button" class="btn btn-back" id="back-to-services">← Services</button>
      <div id="calendar-container" class="calendar-container"></div>
    </section>
    <section id="step-3" class="step-content" aria-labelledby="details-heading">
      <h2 id="details-heading">Your details</h2>
      <p id="selected-slot-info" class="selected-info"></p>
      <button type="button" class="btn btn-back" id="back-to-slots">← Times</button>
      <form id="booking-form" novalidate>
        <div class="hp-field" aria-hidden="true">
          <label for="hp">Website</label>
          <input type="text" id="hp" name="website" tabindex="-1" autocomplete="off">
        </div>
        <div class="form-group">
          <label for="name">Name <span aria-hidden="true">*</span></label>
          <input type="text" id="name" name="name" autocomplete="name" required aria-describedby="name-error">
          <span class="error-message" id="name-error" aria-live="polite"></span>
        </div>
        <div class="form-group">
          <label for="email">Email <span aria-hidden="true">*</span></label>
          <input type="email" id="email" name="email" autocomplete="email" required aria-describedby="email-error">
          <span class="error-message" id="email-error" aria-live="polite"></span>
        </div>
        <div class="form-group">
          <label for="phone">Phone <span class="optional">(optional)</span></label>
          <input type="tel" id="phone" name="phone" autocomplete="tel">
        </div>
        <div class="form-group">
          <label for="quantity">Quantity</label>
          <input type="number" id="quantity" name="quantity" min="1" max="1" value="1" inputmode="numeric" aria-describedby="quantity-error">
          <span class="error-message" id="quantity-error" aria-live="polite"></span>
        </div>
        <button type="submit" class="btn btn-primary">Review booking</button>
      </form>
    </section>
    <section id="step-4" class="step-content" aria-labelledby="review-heading">
      <h2 id="review-heading">Confirm your booking</h2>
      <p id="review-summary" class="selected-info"></p>
      <button type="button" class="btn btn-back" id="back-to-details">← Edit details</button>
      <button type="button" class="btn btn-primary" id="place-booking">Confirm booking</button>
    </section>
    <section id="step-5" class="step-content" aria-labelledby="confirmation-heading"></section>

    <div id="loading" class="loading-overlay" aria-hidden="true"><div class="spinner"></div><p>Confirming…</p></div>
    <div id="error-banner" class="error-banner" role="alert" aria-live="assertive"></div>
    <footer><span>Powered by OpenBook · Open source booking software</span></footer>
  </main>
  <script src="js/config-loader.js"></script>
  <script src="js/timezone.js"></script>
  <script src="js/api-client.js"></script>
  <script src="js/calendar.js"></script>
  <script src="js/booking-form.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
