<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" role="img" aria-labelledby="title desc">
  <title id="title">Connect Avery Studio's test Sheet to Apps Script</title>
  <desc id="desc">Illustrative Apps Script project showing a sample property connected to Avery Studio's disposable booking data.</desc>
  <rect width="720" height="520" rx="24" fill="#e8ede4"/>
  <text x="36" y="44" font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="2" fill="#245744">ILLUSTRATIVE · DISPOSABLE TEST SETUP</text>
  <rect x="36" y="66" width="648" height="400" rx="18" fill="#fff" stroke="#cbd5cb"/>
  <rect x="36" y="66" width="648" height="56" rx="18" fill="#245744"/><path d="M36 104v18h648v-18" fill="#245744"/>
  <circle cx="62" cy="94" r="6" fill="#b9d0c2"/><circle cx="83" cy="94" r="6" fill="#d8c29b"/>
  <text x="108" y="100" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#fff">Avery Studio · test project</text>
  <rect x="54" y="142" width="176" height="294" rx="10" fill="#f3f6f2"/>
  <text x="72" y="171" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#56645c">PROJECT FILES</text>
  <rect x="66" y="188" width="152" height="34" rx="5" fill="#dfe8e1"/><text x="80" y="211" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#245744">Code.gs</text>
  <text x="80" y="252" font-family="Arial,sans-serif" font-size="13" fill="#56645c">BookingService.gs</text>
  <text x="80" y="285" font-family="Arial,sans-serif" font-size="13" fill="#56645c">CalendarService.gs</text>
  <text x="80" y="318" font-family="Arial,sans-serif" font-size="13" fill="#56645c">EmailService.gs</text>
  <rect x="246" y="142" width="416" height="190" rx="10" fill="#20352d"/>
  <text x="268" y="174" font-family="monospace" font-size="13" fill="#b9d0c2">// Sample project configuration</text>
  <text x="268" y="208" font-family="monospace" font-size="13" fill="#fff">const business = "Avery Studio";</text>
  <text x="268" y="240" font-family="monospace" font-size="13" fill="#fff">const dataSource = "TEST_SHEET_ID";</text>
  <text x="268" y="272" font-family="monospace" font-size="13" fill="#fff">const calendar = "TEST_CALENDAR_ID";</text>
  <text x="268" y="308" font-family="Arial,sans-serif" font-size="11" fill="#d8c29b">Illustrative placeholders · never use these as real IDs</text>
  <path d="M450 333v24" stroke="#245744" stroke-width="3"/><path d="m442 350 8 10 8-10" fill="none" stroke="#245744" stroke-width="3"/>
  <rect x="246" y="372" width="416" height="64" rx="10" fill="#e6ede7" stroke="#cbd5cb"/>
  <circle cx="270" cy="404" r="10" fill="#245744"/><path d="m265 404 4 4 7-8" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
  <text x="292" y="399" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#20352d">Connected to the disposable Sheet</text>
  <text x="292" y="420" font-family="Arial,sans-serif" font-size="12" fill="#56645c">Calendar service enabled for the test project</text>
  <text x="360" y="493" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#56645c">Illustrative only · use the current source and exact settings in GitHub</text>
