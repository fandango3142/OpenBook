<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-labelledby="title desc">
  <title id="title">Choose an appointment</title><desc id="desc">A customer selects one open time from three available appointment times.</desc>
  <rect x="27" y="20" width="266" height="200" rx="16" fill="#fff" stroke="#cbd3c3" stroke-width="2"/>
  <text x="48" y="56" fill="#20352d" font-family="system-ui,sans-serif" font-size="17" font-weight="650">Choose a time</text>
  <text x="48" y="82" fill="#56645c" font-family="system-ui,sans-serif" font-size="12">Wednesday, 18 November</text>
  <rect x="47" y="101" width="226" height="29" rx="7" fill="#f1f4ee"/><text x="65" y="120" fill="#56645c" font-family="system-ui,sans-serif" font-size="11" font-weight="600">AVAILABLE TIMES</text>
  <rect x="47" y="143" width="66" height="44" rx="8" fill="#fff" stroke="#cbd3c3" stroke-width="2"/><rect x="127" y="143" width="66" height="44" rx="8" fill="#245744" stroke="#245744" stroke-width="2"/><rect x="207" y="143" width="66" height="44" rx="8" fill="#fff" stroke="#cbd3c3" stroke-width="2"/>
  <g font-family="system-ui,sans-serif" font-size="11" text-anchor="middle"><text x="80" y="170" fill="#20352d">10:00 am</text><text x="160" y="170" fill="#fff" font-weight="700">11:00 am</text><text x="240" y="170" fill="#20352d">2:00 pm</text></g>
</svg>
